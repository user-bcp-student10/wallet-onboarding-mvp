# Blueprint de Render: despliega la app (API + frontend) como un solo servicio Docker.
# El disco del plan gratuito es efímero: data/db.json se borra en cada reinicio.
services:
  - type: web
    name: wallet-onboarding-mvp
    runtime: docker
    plan: free
    healthCheckPath: /api/salud
    envVars:
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_ENDPOINTS
        value: "true"
      # RS-8: Render pide los valores al crear el servicio; no se versionan.
      - key: TOKEN_ANALISTA
        sync: false
      - key: TOKEN_ADMIN
        sync: false
